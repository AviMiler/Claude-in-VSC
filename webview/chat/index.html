<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="{{csp}}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{chat}}/chat.css">
  <link rel="stylesheet" href="{{chat}}/highlight-theme.css">
  <title>Claude Code Local</title>
</head>
<body>
  <div id="app">
    <header class="header">
      <button id="history-btn" class="ghost header-title" title="שיחות קודמות">
        <span id="header-title">שיחות קודמות</span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="new-btn" class="ghost icon-btn" title="שיחה חדשה" aria-label="שיחה חדשה">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div id="history-panel" class="popover history-panel" hidden></div>
    </header>

    <main id="thread" class="thread" aria-live="polite">
      <div id="empty" class="empty">
        <div class="wordmark">
          <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="2.5" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="21.5" y2="12"/><line x1="5.3" y1="5.3" x2="18.7" y2="18.7"/><line x1="18.7" y1="5.3" x2="5.3" y2="18.7"/></g></svg>
          <span dir="ltr">Claude Code</span>
        </div>
        <p class="empty-hint">שאלו כל דבר על הקוד שלכם</p>
      </div>
      <div id="items" class="items"></div>
      <div id="spinner" class="spinner" hidden>
        <span class="spinner-glyph" aria-hidden="true">✻</span>
        <span id="spinner-verb">חושב…</span>
      </div>
    </main>

    <footer class="composer-wrap">
      <div id="notice" class="notice" hidden></div>
      <div id="slash-menu" class="popover slash-menu" hidden role="listbox"></div>
      <div id="menu" class="popover menu" hidden role="menu"></div>
      <div class="composer">
        <textarea id="input" rows="1" dir="auto" placeholder="כתבו ל-Claude… (הקלידו / לפקודות וסקילים)"></textarea>
        <div class="composer-footer">
          <button id="mode-btn" class="chip" title="מצב הרשאות"></button>
          <button id="model-btn" class="chip" title="מודל"></button>
          <span id="cwd-note" class="cwd-note" hidden></span>
          <span class="spacer"></span>
          <button id="send-btn" class="send-btn" title="שליחה" aria-label="שליחה" disabled>
            <svg class="i-send" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="i-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <script nonce="{{nonce}}" src="{{vendor}}/marked.umd.js"></script>
  <script nonce="{{nonce}}" src="{{vendor}}/highlight.min.js"></script>
  <script nonce="{{nonce}}" src="{{vendor}}/powershell.min.js"></script>
  <script nonce="{{nonce}}" src="{{chat}}/util.js"></script>
  <script nonce="{{nonce}}" src="{{chat}}/markdown.js"></script>
  <script nonce="{{nonce}}" src="{{chat}}/tools.js"></script>
  <script nonce="{{nonce}}" src="{{chat}}/thread.js"></script>
  <script nonce="{{nonce}}" src="{{chat}}/cards.js"></script>
  <script nonce="{{nonce}}" src="{{chat}}/menu.js"></script>
  <script nonce="{{nonce}}" src="{{chat}}/slash-menu.js"></script>
  <script nonce="{{nonce}}" src="{{chat}}/composer.js"></script>
  <script nonce="{{nonce}}" src="{{chat}}/history.js"></script>
  <script nonce="{{nonce}}" src="{{chat}}/app.js"></script>
</body>
</html>
